version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - just-barcodes
    groups:
      # One PR for routine minor/patch bumps; majors still get their own PR.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - just-barcodes
    groups:
      github-actions:
        patterns:
          - "*"
